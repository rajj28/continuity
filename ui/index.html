<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continuity — Release Control Room</title>
<style>
  /* Status palette is reserved and never used for a category; identity uses
     the validated categorical order. A verdict always carries a word as well
     as a colour, so it survives greyscale and colour-blind reading. */
  :root {
    color-scheme: dark;
    --bg:        #121211;
    --surface:   #1a1a19;
    --raised:    #232322;
    --line:      #32322f;
    --ink:       #f4f3ef;
    --ink-2:     #a8a69c;
    --ink-3:     #6f6d65;
    --good:      #0ca30c;
    --warning:   #fab219;
    --serious:   #ec835a;
    --critical:  #d03b3b;
    --accent:    #3987e5;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  header {
    display: flex; align-items: baseline; gap: 28px; flex-wrap: wrap;
    padding: 18px 26px; border-bottom: 1px solid var(--line);
    background: var(--surface); position: sticky; top: 0; z-index: 5;
  }
  .brand { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
  .brand b { font-weight: 650; }
  .brand span { color: var(--ink-3); }
  .tally { display: flex; gap: 26px; margin-left: auto; align-items: baseline; }
  .tally div { text-align: right; }
  .tally .n { font: 600 26px/1 var(--mono); display: block; }
  .tally .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
              color: var(--ink-3); }
  .stamp { font: 11px/1 var(--mono); color: var(--ink-3); }

  main { display: grid; grid-template-columns: minmax(420px, 1.15fr) 1fr;
         gap: 22px; padding: 22px 26px 60px; align-items: start; }
  @media (max-width: 1080px) { main { grid-template-columns: 1fr; } }

  h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
       color: var(--ink-3); margin: 0 0 10px; font-weight: 600; }

  .card { background: var(--surface); border: 1px solid var(--line);
          border-radius: 10px; margin-bottom: 14px; overflow: hidden; }

  /* --- market rows ------------------------------------------------- */
  .mkt { display: grid; grid-template-columns: 8px 1fr auto; gap: 0;
         border-bottom: 1px solid var(--line); cursor: pointer;
         background: none; border-left: 0; border-right: 0; border-top: 0;
         width: 100%; text-align: left; color: inherit; font: inherit;
         padding: 0; }
  .mkt:last-child { border-bottom: 0; }
  .mkt:hover, .mkt[aria-selected="true"] { background: var(--raised); }
  .mkt .bar { background: var(--critical); }
  .mkt.ready .bar { background: var(--good); }
  .mkt.unknown .bar { background: var(--ink-3); }
  .mkt .body { padding: 13px 16px; min-width: 0; }
  .mkt .top { display: flex; align-items: baseline; gap: 10px; }
  .mkt .code { font: 600 14px/1 var(--mono); }
  .mkt .name { color: var(--ink-2); font-size: 13px; }
  .verdict { font: 600 10px/1 var(--mono); letter-spacing: .1em;
             padding: 4px 7px; border-radius: 4px; }
  .verdict.no  { background: rgba(208,59,59,.16);  color: #f08a8a; }
  .verdict.yes { background: rgba(12,163,12,.18);  color: #63d063; }
  .verdict.unk { background: rgba(111,109,101,.2); color: var(--ink-2); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .tag { font-size: 11px; padding: 3px 7px; border-radius: 4px;
         background: rgba(208,59,59,.12); color: #eb9a9a;
         border: 1px solid rgba(208,59,59,.25); }
  .tag.hard { background: rgba(250,178,25,.1); color: #e0b558;
              border-color: rgba(250,178,25,.3); }
  .mkt .cov { padding: 13px 16px; text-align: right; white-space: nowrap; }
  .cov .frac { font: 12px/1 var(--mono); color: var(--ink-2); }
  .meter { width: 82px; height: 4px; border-radius: 2px; margin-top: 7px;
           background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--warning); }
  .meter.full i { background: var(--good); }
  .pill { display:inline-block; margin-top:8px; font: 600 10px/1 var(--mono);
          letter-spacing:.08em; color: #7fb0f0; background: rgba(57,135,229,.14);
          border: 1px solid rgba(57,135,229,.3); padding: 4px 7px;
          border-radius: 4px; }

  /* --- detail ------------------------------------------------------- */
  .pad { padding: 15px 17px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10px; letter-spacing: .1em;
       text-transform: uppercase; color: var(--ink-3); font-weight: 600;
       padding: 0 0 8px; }
  td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.num { font: 13px/1.4 var(--mono); text-align: right; white-space: nowrap; }
  td.num.fail { color: #f08a8a; }
  td.num.pass { color: #63d063; }
  .q { font: 11px/1.5 var(--mono); color: var(--ink-3); word-break: break-all;
       display: block; margin-top: 3px; }

  .prop { border-left: 3px solid var(--accent); background: var(--raised); }
  .prop dl { display: grid; grid-template-columns: 96px 1fr; gap: 7px 14px;
             margin: 0 0 14px; }
  .prop dt { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
             color: var(--ink-3); padding-top: 3px; }
  .prop dd { margin: 0; font-size: 13px; }
  .prop dd.mono { font-family: var(--mono); font-size: 12px; }
  button.go { font: 600 13px var(--sans); padding: 9px 16px; border-radius: 7px;
              border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button.go:hover { filter: brightness(1.1); }
  button.go:disabled { opacity: .5; cursor: progress; }
  .why { color: var(--ink-2); font-size: 12px; margin: 10px 0 0; }

  .row { display: flex; justify-content: space-between; gap: 12px;
         padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .row:first-of-type { border-top: 0; }
  .out { font: 600 10px/1 var(--mono); letter-spacing: .08em; padding: 4px 7px;
         border-radius: 4px; }
  .out.succeeded { background: rgba(12,163,12,.18); color: #63d063; }
  .out.lucky     { background: rgba(250,178,25,.14); color: #e0b558; }
  .out.failed    { background: rgba(208,59,59,.16); color: #f08a8a; }
  .muted { color: var(--ink-3); }
  pre.log { margin: 12px 0 0; padding: 12px; background: #0e0e0d;
            border: 1px solid var(--line); border-radius: 7px; max-height: 300px;
            overflow: auto; font: 11px/1.6 var(--mono); color: var(--ink-2);
            white-space: pre-wrap; }
  .err { color: #f08a8a; padding: 15px 17px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>CONTINUITY</b> <span>/ Release Control Room</span></div>
  <div class="stamp" id="stamp">connecting…</div>
  <div class="tally">
    <div><span class="n" id="n-ready">–</span><span class="k">Ready</span></div>
    <div><span class="n" id="n-blocked">–</span><span class="k">Blocked</span></div>
  </div>
</header>

<main>
  <section>
    <h2>Markets</h2>
    <div class="card" id="markets"><div class="pad muted">Loading…</div></div>

    <h2>Earned autonomy</h2>
    <div class="card" id="autonomy"><div class="pad muted">No repair history yet.</div></div>
  </section>

  <section>
    <h2 id="detail-title">Select a market</h2>
    <div class="card" id="detail">
      <div class="pad muted">
        Every number here is read from Grafana through the same interface the
        agents use, and each one shows the query that produced it.
      </div>
    </div>

    <h2>Recent repairs</h2>
    <div class="card" id="activity"><div class="pad muted">Nothing yet.</div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let selected = null;
let busy = false;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function verdictClass(ready) {
  return ready === true ? "yes" : ready === false ? "no" : "unk";
}
function verdictWord(ready) {
  // A word as well as a colour: the answer must survive greyscale.
  return ready === true ? "READY" : ready === false ? "BLOCKED" : "UNJUDGED";
}

function renderMarkets(markets) {
  $("markets").innerHTML = markets.map(m => {
    const cls = m.ready === true ? "ready" : m.ready === null ? "unknown" : "";
    const pct = m.owed ? Math.round(100 * m.present / m.owed) : 0;
    const tags = m.blockers.map(b =>
      `<span class="tag ${b.repairable ? "" : "hard"}" title="${esc(b.requirement)}">${esc(b.dimension)}: ${esc(b.label)}</span>`
    ).join("");
    return `<button class="mkt ${cls}" data-m="${esc(m.market)}"
              aria-selected="${selected === m.market}">
      <span class="bar"></span>
      <span class="body">
        <span class="top">
          <span class="code">${esc(m.market)}</span>
          <span class="name">${esc(m.name)}</span>
          <span class="verdict ${verdictClass(m.ready)}">${verdictWord(m.ready)}</span>
        </span>
        ${tags ? `<span class="tags">${tags}</span>` : ""}
        ${m.pending ? `<span class="pill">PROPOSAL AWAITING APPROVAL</span>` : ""}
      </span>
      <span class="cov">
        <span class="frac">${m.present}/${m.owed}</span>
        <span class="meter ${pct >= 100 ? "full" : ""}"><i style="width:${pct}%"></i></span>
      </span>
    </button>`;
  }).join("");
  document.querySelectorAll(".mkt").forEach(el =>
    el.onclick = () => select(el.dataset.m));
}

function renderAutonomy(rows) {
  if (!rows.length) return;
  $("autonomy").innerHTML = `<div class="pad"><table>
    <tr><th>Strategy</th><th>Market</th><th>Record</th><th>Authority</th></tr>
    ${rows.map(r => `<tr>
      <td style="font-family:var(--mono)">${esc(r.strategy)}</td>
      <td style="font-family:var(--mono)">${esc(r.market)}</td>
      <td class="muted">${r.succeeded} understood · ${r.lucky} lucky · ${r.failed} failed</td>
      <td style="font-family:var(--mono);font-size:12px">${esc(r.tier)}</td>
    </tr>`).join("")}
  </table>
  <p class="why">Read from Prometheus at decision time, never held in agent
  memory. A <em>lucky</em> repair passed while its prediction did not hold: it
  raises the denominator without raising the numerator, so getting away with it
  costs authority rather than earning it.</p></div>`;
}

function renderActivity(rows) {
  if (!rows.length) return;
  $("activity").innerHTML = `<div class="pad">${rows.map(r => `
    <div class="row">
      <span>
        <b style="font-family:var(--mono)">${esc(r.strategy)}</b>
        <span class="muted"> ${esc(r.market)}</span><br>
        <span class="q">${esc(r.predicted)} → measured ${r.observed}</span>
      </span>
      <span style="text-align:right;white-space:nowrap">
        <span class="out ${esc(r.outcome)}">${esc(r.outcome.toUpperCase())}</span><br>
        <span class="q">${esc((r.at||"").slice(0,16).replace("T"," "))}</span>
      </span>
    </div>`).join("")}</div>`;
}

function renderDetail(d) {
  const rows = d.measurements.map(m => {
    const has = m.value !== null && m.bar !== null;
    let ok = null;
    if (has) {
      ok = m.label === "Loudness" ? Math.abs(m.value - m.bar) <= 1
         : m.label === "True peak" ? m.value <= m.bar
         : m.value <= m.bar;
    }
    return `<tr>
      <td>${esc(m.label)}<span class="q">${esc(m.query)}</span></td>
      <td class="num ${ok === null ? "" : ok ? "pass" : "fail"}">
        ${m.value === null ? "<span class='muted'>not measured</span>"
                           : esc(m.value) + " " + esc(m.unit)}</td>
      <td class="num muted">${m.bar === null ? "–" : esc(m.bar)}</td>
    </tr>`;
  }).join("");

  let proposal = "";
  if (d.proposal) {
    const p = d.proposal;
    proposal = `<div class="pad prop">
      <h2 style="margin-bottom:12px">Proposal awaiting a human</h2>
      <dl>
        <dt>Strategy</dt><dd class="mono">${esc(p.strategy)} ${esc(JSON.stringify(p.params))}</dd>
        <dt>Predicts</dt><dd class="mono">${esc(p.prediction)}</dd>
        <dt>Authority</dt><dd class="mono">${esc(p.tier)}</dd>
        <dt>Because</dt><dd>${esc(p.rationale)}</dd>
        <dt>Evidence</dt><dd>${p.evidence.map(e => `<span class="q">${esc(e)}</span>`).join("")}</dd>
      </dl>
      <button class="go" id="approve" data-m="${esc(d.market)}">Approve and run</button>
      <p class="why">This strategy has no measured history in this market, so it
      proposes and a person decides. After three verified successes the same
      repair runs without this step.</p>
      <pre class="log" id="runlog" hidden></pre>
    </div>`;
  }

  $("detail").innerHTML = `${proposal}<div class="pad"><table>
    <tr><th>Measurement</th><th style="text-align:right">Measured</th>
        <th style="text-align:right">Bar</th></tr>${rows}</table></div>`;

  const btn = $("approve");
  if (btn) btn.onclick = () => approve(btn.dataset.m, btn);
}

async function approve(market, btn) {
  busy = true;
  btn.disabled = true;
  btn.textContent = "Running…";
  const log = $("runlog");
  log.hidden = false;
  log.textContent = "acting, measuring, verifying…";
  try {
    const r = await fetch(`/api/approve/${market}`, {method: "POST"});
    const d = await r.json();
    log.textContent = (d.output || "") + (d.error ? "\n" + d.error : "");
  } catch (e) {
    log.textContent = String(e);
  } finally {
    busy = false;
    btn.textContent = "Approve and run";
    refresh();
    select(market);
  }
}

async function select(market) {
  selected = market;
  $("detail-title").textContent = market;
  document.querySelectorAll(".mkt").forEach(el =>
    el.setAttribute("aria-selected", el.dataset.m === market));
  try {
    const d = await (await fetch(`/api/market/${market}`)).json();
    if (d.error) throw new Error(d.error);
    renderDetail(d);
  } catch (e) {
    $("detail").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

async function refresh() {
  if (busy) return;
  try {
    const d = await (await fetch("/api/state")).json();
    if (d.error) throw new Error(d.error);
    $("n-ready").textContent = d.ready;
    $("n-blocked").textContent = d.blocked;
    $("stamp").textContent = "live · " + d.at.replace("T", " ").replace("+00:00", "Z");
    renderMarkets(d.markets);
    renderAutonomy(d.autonomy);
    renderActivity(d.activity);
    if (selected) document.querySelectorAll(".mkt").forEach(el =>
      el.setAttribute("aria-selected", el.dataset.m === selected));
  } catch (e) {
    $("stamp").textContent = "disconnected — " + e.message;
  }
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
